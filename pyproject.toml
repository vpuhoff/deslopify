[project]
name = "deslopify"
dynamic = ["version"]
description = "Python-библиотека для удаления следов ИИ-генерации в текстах через OpenRouter и PydanticAI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "vpuhoff" }]
keywords = ["ai", "text", "deslop", "openrouter", "pydantic-ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]
dependencies = [
    "pydantic>=2.10",
    "pydantic-ai-slim[openrouter]>=1.101.0",
]

[project.urls]
Homepage = "https://github.com/vpuhoff/deslopify"
Repository = "https://github.com/vpuhoff/deslopify"
Issues = "https://github.com/vpuhoff/deslopify/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
deslopify = "deslopify.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/deslopify/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/deslopify"]

[tool.hatch.build.targets.wheel.force-include]
"src/deslopify/data/clean-spec.md" = "deslopify/data/clean-spec.md"

[tool.uv]
package = true
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
